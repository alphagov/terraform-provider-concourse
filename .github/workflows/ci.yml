name: ci

on:
  pull_request:
  workflow_call:

jobs:

  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        concourse-version:
          - "6.5.1"
          - "6.7.0"
          - "7.0.0"
          - "7.8.2"
          - "8.1.1"
          - "8.2.5"
          - "8.3.1"
        terraform-version:
          - "1.2"
        include:
          - terraform-version: "0.13"
            concourse-version: "8.3.1"
          - terraform-version: "0.14"
            concourse-version: "8.3.1"
          - terraform-version: "0.15"
            concourse-version: "8.3.1"
          - terraform-version: "1.0"
            concourse-version: "8.3.1"
          - terraform-version: "1.1"
            concourse-version: "8.3.1"
    steps:
      # avoid confusion around which terraform is being used
      - name: rm existing terraform
        run: "{ type -P terraform && sudo rm $(type -P terraform) ; } || true"

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7.0.0
        with:
          go-version: '1.27'

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: unit-tests
        run: make unit-tests

      - name: setup docker compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # docker/setup-compose-action@v2.4.0

      - name: ensure-containers-exist
        env:
          CONCOURSE_VERSION: ${{ matrix.concourse-version }}
        run: |
          docker compose up -d && docker compose down

      - name: integration-tests
        env:
          CONCOURSE_VERSION: ${{ matrix.concourse-version }}
          TF_ACC_TERRAFORM_VERSION: ${{ matrix.terraform-version }}
        run: |
          sudo --preserve-env make integration-tests-prep-keys
          make integration-tests
